name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Create Flutter project structure
        run: flutter create --project-name toudi_logistic . --platforms android

      # 🔥 YEH NAYA STEP HAI - Kotlin version update karne ke liye
      - name: Update Kotlin version
        run: |
          sed -i "s/ext.kotlin_version = '1.7.1'/ext.kotlin_version = '1.9.24'/" android/build.gradle
          sed -i "s/id 'org.jetbrains.kotlin.android' version '1.7.1'/id 'org.jetbrains.kotlin.android' version '1.9.24'/" android/settings.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toudi-logistic-apk
          path: build/app/outputs/flutter-apk/app-release.apk
